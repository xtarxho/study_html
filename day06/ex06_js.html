<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title></title>

    <script>
        function showFruit(){

            //현재 선택된 옵션의 value
            let selFruit = document.getElementById("fruit").value;

            if( selFruit === '' ){
                alert("과일을 선택하시오");
                return;
            }

            alert(selFruit);
        }
    </script>

</head>

<body>
    <select id="fruit">
        <option value="">:::과일을 선택하세요:::</option>
        <option value="apple">사과</option>
        <option value="banana">바나나</option>
    </select>

    <input type="button" value="확인" onclick="showFruit()"/>

</body>

</html>
