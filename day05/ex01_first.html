<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title></title>

    <script>
        //dom객체 : document object model
        document.write("hello javascript<br/>");
        document.write("안녕하세요" + "<br/>"); //이어붙인다
        document.write("'반가워요' ", "hello"); // +랑 같은 역할
        document.write('<br/>', '"이렇게도 쓸수있어요"'); 
    </script>

</head>

<body>
    <br/>
    자바스크립트란 웹페이지에 동작과 기능을 넣어주는 프로그래밍 언어이다.
</body>

</html>
