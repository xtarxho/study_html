<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title></title>

    <script>
        // 프롬프트로 국어, 수학성적을 입력받고
        // 두 과목 모두 80점 이상이면 '합격'을 출력
        // 그렇지 않으면 '불합격'을 출력

        let kor = prompt('국어');
        let mat = prompt('수학');

        if( kor >= 80 && mat >= 80 ){
            alert('합격')
        }else{
            alert('불합격')
        }

        kor >= 80 && mat >= 80 ? document.write("합격") : document.write("불합격")


    </script>

</head>

<body>

</body>

</html>
