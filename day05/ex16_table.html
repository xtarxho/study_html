<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title></title>

    <style>
        table {
            border-collapse: collapse;
        }

        th {
            background: #aaf;
            width: 100px;
        }
    </style>

    <script>
        document.write("<table border='1'>")

        document.write("<tr>")

        for (let i = 2; i <= 9; i++) {
            document.write("<th>", i, "단</th>")
        }

        document.write("</tr>")

        //구구단
        for (let i = 1; i <= 9; i++) {

            document.write("<tr>")

            for (let j = 2; j <= 9; j++) {

                document.write("<td align='center'>" + j + "*" + i + "=" + (i * j) + "</td>")

            }//inner

            document.write("</tr>")


        }//outer

        document.write("</table>")
    </script>

</head>

<body>

</body>

</html>
