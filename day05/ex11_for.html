<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title></title>

    <script>

        let su = prompt('숫자')

        for( let i = 1; i <= 9; i++ ){
            document.write(su + '*' + i + '=' + (su * i) + '<br/>' )
        }

        document.write("<hr/>")

        for( let i = 6; i >= 1; i-- ){
            document.write("<h"+i+">",i+"자바스크립트","</h"+i+">")
        }

        document.write("<ul>")

        document.write("<hr/>")
        for( let i = 0; i < 5; i++ ){
            document.write( '<li>'+ '메뉴' + i +'</li>' )
        }
        document.write("</ul>")
    </script>

</head>

<body>

</body>

</html>
