<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title></title>

    <script>
        /*
        90점 이상 A
        80점 이상 B
        70점 이상 C
        60점 이상 D
        59점 이하 F

        프롬프트를 통해 점수를 입력받고 입력받은 점수에 해당하는 성적을 출력
        */

        let num = prompt('점수');
        
        let res

        let numPat = /^[0-9]+$/

        //유효성 체크 (무결성 체크)
        if (numPat.test(num) && num != null) {

            if (num >= 0 && num <= 100) {

                if (num >= 90) {
                    res = "A";
                } else if (num >= 80) {
                    res = "B";
                } else if (num >= 70) {
                    res = "C";
                } else if (num >= 60) {
                    res = "D";
                } else {
                    res = "F";
                }

            } else {
                alert("점수는 0~100사이의 값")
            }


        } else {
            alert("성적은 정수로 입력")
            r
        }

        document.write("성적 : " + res)

    </script>

</head>
