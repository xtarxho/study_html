<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>자바스크립트의 자료형</title>

    <script>

        //var : 중복된 변수명을 허용
        //let : 중복된 변수명을 허용하지 않는다
        //const : 상수
        var num = 10;
        var num2 = "숫자10";

        document.write("num : " + num);
        document.write("<br/>num2 : ", num2);

        let number = 10;
        let number2 = true;

        document.write("<br/>number : " + number);
        document.write("<br/>number2 : ", number2);

        const test = 100;
        const test2 = '안녕';
        // test = 150; <-- const자료형의 값을 변경할 수 없다
        
        document.write("<br/>test : " + test);
        document.write("<br/>number2 : ", number2);

    </script>

</head>

<body>

</body>

</html>
