<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title></title>

    <style>
        legend{
            width: 0;
            height: 0;
            position: absolute;
            left: -9999px;
        }

        input[type=password]{
            background: red;
        }
        input[type=text]{
            border: none;
            outline: none;
        }
    </style>

</head>

<body>
    <!-- 서버측으로 데이터를 전달하기 위한 태그 -->
     <!-- action : 데이터를 전달할 페이지 주소 -->
      <!-- method : 전송방식
           1) get방식 : 속도가 빠름. url에 파라미터 노출됨
           2) post방식 : 속도가 느림. url에 파라미터가 노출되지 않음
           -->
    <form action="ex03_table.html" method="get">
        <fieldset>
            <legend>회원가입</legend>

            <p>
                <label for="myid">아이디 : </label>
                <input type="text" size="12" id="myid" name="id"/>
            </p>

            <p>
                비밀번호 : 
                <input type="password" name="pwd" placeholder="비밀번호를 입력하세요"/>
            </p>

            <p>
                관심분야 : 
                <input type="checkbox" value="html" name="chk1"/> HTML
                <input type="checkbox" value="CSS" name="chk1"/> CSS
                <input type="checkbox" value="JS" name="chk1"/> JavaScript
            </p>

            <p>
                메일 수신 여부 : 
                <input type="radio" value="y" name="mailcheck"/>예
                <input type="radio" value="n" name="mailcheck"/>아니오
            </p>

            <p>
                <input type="submit" value="전송"/>
                <input type="reset" value="취소"/>
                <input type="button" value="확인"/>
                <input type="file"/>
            </p>

        </fieldset>
    </form>

    <form>

        <p>
            <textarea cols="50" rows="5"></textarea>
        </p>

        <p>
            <select>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
            </select>
        </p>

    </form>


</body>

</html>
