<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title></title>

    <link rel="stylesheet" href="css/reset.css" />

    <style>
        table {
            border-color: gray;
            width: 900px;
            background: #ffc;
            margin: 0 auto;
        }

        caption {
            font: bold 20px sans-serif;
            margin-bottom: 10px;
        }

        th, td {
            padding: 15px 20px;
        }

        .aa {
            text-align: center;
        }

        tbody tr:nth-child(2) td,
        tbody tr:nth-child(3) td{
            padding: 15px 20px 50px 20px;
        }

        thead th{
            background: #36f;
            color: #fff;
            border-bottom: 5px solid black;
        }

    </style>

</head>

<body>
    <table border="1">
        <caption>업종별 모범거래기준 주요 내용 비교</caption>

        <thead>
            <tr>
                <th width="20%">구분</th>
                <th width="20%">제빵(4월)</th>
                <th width="20%">피자(7월)</th>
                <th width="20%">치킨(7월)</th>
                <th width="20%">커피(11월)</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th>영업지역</th>
                <td class="aa">500m</td>
                <td class="aa">1,500m</td>
                <td class="aa">800m</td>
                <td class="aa">500m</td>
            </tr>

            <tr>
                <th>광고</th>
                <td>관련내용 없음<br />(분쟁없음)</td>
                <td>총 광고비 사전동의<br />광고내역 송부 등</td>
                <td>총 광고비 사전동의<br />광고내역 송부 등</td>
                <td>관련내용 없음<br />(분쟁없음)</td>
            </tr>

            <tr>
                <th>대금지급</th>
                <td>관련내용 없음<br />(분쟁없음)</td>
                <td>관련내용 없음<br />(분쟁없음)</td>
                <td>관련내용 없음</td>
                <td>월 1~2회 정산<br />정산기한 최소 7일 보장</td>
            </tr>
        </tbody>

    </table>
</body>

</html>
