<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title></title>

    <script>
        window.onload = function(){
            let selDan = document.getElementById("selDan")

            for( let i = 2; i <= 9; i++ ){

                //<option></option>
                let option = document.createElement("option")
                
                //<option>2단</option>
                option.innerHTML = i + "단"
                
                //<option value='2'>2단</option>
                option.value = i

                selDan.appendChild(option)

            }

        }//onload

        function send(){

            let dan = document.getElementById("selDan").value;
            let res = document.getElementById("res");

            //구구단
            let str = ''

            for( let i = 1; i <= 9; i++ ){

                str += dan + 'x' + i + '=' + dan*i + '<br/>'

            }

            res.innerHTML = str;

        }

    </script>

</head>

<body>
    <select id="selDan"></select>

    <input type="button" value="확인" onclick="send()"/>

    <div id="res"></div>

</body>

</html>
