<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>background</title>

    <style>
        p {
            border: 1px solid red;
            padding: 50px;
            width: 500px;
            height: 150px;
        }

        .bcg1 {
            background:yellow url(image/background.jpg ) no-repeat right bottom;
        }

        .bcg2{
            background:#aca url(image/background.jpg) no-repeat 20px 100px;
        }

        .bcg3{
            background:url(image/background.jpg) no-repeat center;
        }

        .bcg4{
            background:url(image/background.jpg) no-repeat 70% 10%;
        }

    </style>

</head>

<body>
    <p class="bcg1">배경연습</p>
    <p class="bcg2">배경연습</p>
    <p class="bcg3">배경연습</p>
    <p class="bcg4">배경연습</p>
</body>

</html>
