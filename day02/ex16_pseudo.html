<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>pseudo(가상) 클래스</title>

    <style>
        a{ text-decoration:none;
           color:gray; }

        /* 슈도클래스 : html요소의 특정한 상태나 조건을 선택하기 위해 사용하는 선택자 */
        a:hover{ color:orange;
                 text-decoration:underline; }
        
        a:active{ color:red; }
    </style>

</head>

<body>
    <a href="#">메뉴1</a> <br/>
    <a href="#">메뉴2</a> <br/>
    <a href="#">메뉴3</a> 
</body>

</html>
