<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>숙제 메뉴 만들기</title>

    <style>
        *{margin:0; padding:0;}

        .menu-box{
            width:130px;
            background:#f0f0f0;
            border:1px solid #ccc;
            padding:10px;
            text-align:center;
            margin:10px auto;
        }

        .menu-item a{
            display:block;
            text-decoration:none;
            color:#333;
            padding:5px;
        }

        .menu-item a:hover {
            background:#333;
            color:#fff;
        }
    </style>

</head>

<body>

    <div class="menu-box">
        <div class="menu-item">
            <a href="#">COMPANY</a>
        </div>
    </div>
    <div class="menu-box">
        <div class="menu-item">
            <a href="#">PRODUCT</a>
        </div>
    </div>
    <div class="menu-box">
        <div class="menu-item">
            <a href="#">SERVICE</a>
        </div>
    </div>
    <div class="menu-box">
        <div class="menu-item">
            <a href="#">COMMUNITIY</a>
        </div>
    </div>

</body>

</html>
