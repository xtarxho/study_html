<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>리스트 배경</title>

    <style>
        li{ list-style:none; }
        .cls1 li{ 
            background:url(image/arrow.gif) no-repeat 0 center;
            padding-left:10px;
         }
        .cls2 li{ 
            background:url(image/bg_dotted.gif) no-repeat 0 65%;
            padding-left:7px;
         }
    </style>

</head>

<body>

    <ul class="cls1">
        <li>메뉴1</li>
        <li>메뉴2</li>
        <li>메뉴3</li>
        <li>메뉴4</li>
    </ul>
    
    <hr/>
    
    <ul class="cls2">
        <li>메뉴1</li>
        <li>메뉴2</li>
        <li>메뉴3</li>
        <li>메뉴4</li>
    </ul>

</body>

</html>
