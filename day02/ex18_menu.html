<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>간단한 메뉴 만들기</title>

    <style>
        *{margin:0; padding:0;}
        li{ list-style:none }
        #box{ 
            width:130px;
            border:1px solid black;
            padding:10px;
        }

        

        a{ display:block;
           text-decoration:none;
           background:red;
           padding:5px;
           margin:3px 0;
           color:#fff; }
        
        a:hover{ font-weight:bold;
                 background:#0c0;
                 color:#ff0; }
    </style>

</head>

<body>
    
    <div id="box">
        <h1>주 메뉴</h1>

        <ul>
            <li><a href="#">COMPANY</a></li>
            <li><a href="#">PRODUCT</a></li>
            <li><a href="#">SERVICE</a></li>
            <li><a href="#">COMMUNITIY</a></li>
        </ul>

    </div>

</body>

</html>
