<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>dl응용</title>

    <style>
        *{margin:0; padding:0;}

        dl{ width:650px;
            border:5px double gray;
            margin:0 auto; }

        dt{ padding:15px 0;
            text-align:center;
            background:#aaf;
            border-bottom:10px solid blue;
            letter-spacing:10px; /*자간*/} 

        dd{ padding:10px 10px; }
        
        .line{ border-bottom:3px dotted; }
    </style>

</head>

<body>

    <dl>

        <dt><b>메뉴판</b></dt>
        
        <dd class="line">
            탱글탱글한 면발 위에 진하고 윤기가 흐르는 검은 춘장소스가
            듬뿍 올라간 짜장면 입니다.
        </dd>

        <dd>
            매콤한 고추향과 볶은 해산물의 진수. 짬뽕
        </dd>

    </dl>

</body>

</html>
