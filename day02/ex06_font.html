<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>font</title>

    <style>
        .a1{ font-size:20px; }
        .a2{ font-style:italic; }
        .a3{ font-weight:bold; }
        .a4{ font-family:"한컴나무L", "궁서", "굴림", sans_serif; }
        .a5{ font-variant:small-caps; } /*소문자 크기의 대문자를 나타낼 때 사용*/

        /*폰트의 속성을 한번에 적용하려면 순서를 지켜야 한다
          두께, 스타일, 스몰캡, 사이즈, 글꼴 순서대로 작성*/
          .a6{ font:bold normal small-caps 20px "오이체", "궁서체", sans-serif; }
          .a7{ font:20px "오이체", "궁서체", sans-serif; }

          /*
          두께(bold)속성을 적용하려면 글꼴까지 함께 명시되어야 한다
          .a7{ font:bold 20px "돋움"; } (O)
          .a7{ font:bold 20px; } (X)
          */
          </style>

</head>

<body>
    <p class="a1">글자 크기</p>
    <p class="a2">글자 스타일</p>
    <p class="a3">글자 두께</p>
    <p class="a4">글꼴</p>
    <p class="a5">The end</p>

    <p class="a6">단축 키워드</p>
    <p class="a7">단축 키워드</p>
</body>

</html>
