<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>margin(바깥쪽 여백)</title>

    <style>
        div{ border:5px solid blue; }
        .box1{ margin:20px; }
        .box2{ margin:20px 50px; }
        .box3{ margin:0 50px 30px; } /*0일 때 px 생략 가능*/
        .box4{ margin:20px 30px 50px 70px; } 
    </style>

</head>

<body>
    <div class="box1">마진 테스트중</div>
    <div class="box2">마진 테스트중</div>
    <div class="box3">마진 테스트중</div>
    <div class="box4">마진 테스트중</div>
</body>

</html>
