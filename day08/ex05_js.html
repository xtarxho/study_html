<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title></title>

    <script>

        let sido_arr = ['서울', '대전', '대구', '부산']

        //페이지 로딩이 완료되면 실행되는 이벤트 영역
        window.onload = function(){

            let sido = document.getElementById("sido")

            for( let i = 0; i < sido_arr.length; i++ ){

                //<option value='서울'>서울</option>
                let option = document.createElement("option");
                option.innerHTML = sido_arr[i];
                option.value = sido_arr[i];
                sido.appendChild(option)


            }//for

            //출생년도 선택
            let year = document.getElementById("birth_year")
            for( let i = 1970; i <= 2017; i++ ){
                let option = document.createElement("option");
                option.innerHTML = i + '년'
                option.value = i;

                year.appendChild(option)
            }

        }//window.onload

        let last_day = 31;

        function check_yoon(){
            //선택한 년도가 윤년인지 확인
            let year = document.getElementById("birth_year").value;

            if( isYoon(year) ){ //isYoon(year) == true
                last_day = 29;
            }else{
                last_day = 28;
            }

            //윤년체크가 끝났으니 월 추가
            let month = document.getElementById("birth_month")

            //이전에 month에 들어있던 option값 모두 제거
            month.innerHTML=''

            for( let i = 1; i <= 12; i++ ){
                let option = document.createElement("option")
                option.innerHTML = i + "월"
                option.value= i;

                month.appendChild(option);
            }//for

        }

        //윤년검사 함수
        function isYoon(year){
            return (year % 400 == 0 || year % 4 == 0 && year % 100 != 0)
        }


        function monthChange(month){

            let m;

            switch(Number(month)){
                case 1: case 3: case 5:
                case 7: case 8: case 10: case 12:
                    m = 31;
                    break;

                case 4: case 6: case 9: case 11:
                    m = 30;
                    break;

                case 2:
                    m = last_day;
                    break;

            }//switch

            let day = document.getElementById("birth_day")
            day.innerHTML = ''

            for( let i = 1; i <= m; i++ ){
                let option = document.createElement('option')
                option.innerHTML = i + '일'
                option.value = i;

                day.appendChild(option)
            }

        }


    </script>

</head>

<body>
    <div class="container">
        <h2>지역 선택</h2>

        <p>
            <select id="sido">
                <option>지역을 선택하세요</option>
            </select>
        </p>

        <p>
            생년월일 : 
            <select id="birth_year" onchange="check_yoon()">
                <option>년</option>
            </select>
            
            <select id="birth_month" onchange="monthChange(this.value)">
                <option>월</option>
            </select>
            
            <select id="birth_day">
                <option>일</option>
            </select>



        </p>


        <p>
            <input type="date"/>
        </p>

    </div>
</body>

</html>
