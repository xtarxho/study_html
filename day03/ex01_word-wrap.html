<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>word-wrap</title>

    <style>
        p{ width:100px;
           padding:10px;
           border:1px solid red;
         }

         .ww{ word-wrap:break-word; }

    </style>

</head>

<body>
    <p>
        이 문장은 매운 긴 단어를 포함하고 있습니다.
        sdgwefgwaegsgdfgngfsikfuhweafsjdfksdjfsdfieufhskjdfsdfsiudfsdfsfaeswgf
    </p>

    <p class="ww">
        이 문장은 매운 긴 단어를 포함하고 있습니다.
        sdgwefgwaegsgdfgngfsikfuhweafsjdfksdjfsdfieufhskjdfsdfsiudfsdfsfaeswgf
    </p>
</body>

</html>
