<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title></title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            width: 250px;
            border: 1px solid red;
            margin:70px;
            position:relative;
        }

        p {
            width: 130px;
            height: 80px;
            padding: 10px;
            color: #fff;
        }

        .mred {
            background: red;
        }

        .mblue {
            background: blue;
            position: absolute;
            left: 50px;
            top: 30px;
        }

        .mgreen {
            background: green;
        }
    </style>

</head>

<body>
    <div class="box">
        <p class="mred">포지션 보기</p>
        <p class="mblue">포지션 보기</p>
        <p class="mgreen">포지션 보기</p>
    </div>
</body>

</html>
