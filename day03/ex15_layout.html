<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title></title>

    <link rel="stylesheet" href="css/reset.css" />

    <style>
        #layout {
            width: 960px;
            margin: 0 auto;
        }

        #main {
            position: relative;
            height: 150px;
        }

        .hgroup {
            position: absolute;
            left: 5px;
            top: 10px;
        }

        #main li {
            float: left;
        }

        #a1 {
            position: absolute;
            right: 0;
            top: 3px;
        }

        #a1 ul {
            overflow: hidden;
        }

        #a1 li {
            border-right: 1px solid gray;
            border-top: 1px solid gray;
            border-bottom: 1px solid gray;
        }

        #a1 ul li:first-child {
            border-left: 1px solid gray;
        }

        #a1 ul li a {
            display: block;
            padding: 2px 10px;
            color: #666;
        }

        #a1 ul li a:hover {
            background: #999;
            color: #fff;
        }

        #a2 {
            position: absolute;
            right: 0;
            bottom: 0;
        }

        #a2 ul {
            overflow: hidden;
        }

        #a2 li {
            border-right: 1px solid gray;
            border-top: 1px solid gray;
            border-bottom: 1px solid gray;
        }

        #a2 li:first-child {
            border-left: 1px solid gray;
        }

        #a2 li a {
            display: block;
            padding: 10px 20px;
            color: #666;
        }

        #a2 li a:hover {
            background: #aaf;
            color: #fff;
        }

        #content {
            width: 960px;
            overflow: hidden;
            margin-top: 10px;
        }

        .section {
            width: 750px;
            float: left;
        }

        .aside{
            width: 200px;
            float: right;
        }

        .section .article{
            margin-bottom: 10px;
            padding: 20px;
            border: 1px solid #999;
        }

        #footer{
            margin-top: 20px;
        }

    </style>

</head>

<body>
    <div id="layout">

        <div id="main">

            <div class="hgroup">
                <h1>Rint Development</h1>
                <h2>HTML + CSS</h>
            </div>

            <div id="a1">

                <ul>
                    <li><a href="#">WEB</a></li>
                    <li><a href="#">MOBLIE</a></li>
                    <li><a href="#">GAME</a></li>
                    <li><a href="#">SIMULATION</a></li>
                    <li><a href="#">DATA</a></li>
                </ul>

            </div>
            <div id="a2">

                <ul>
                    <li><a href="#">HTML</a></li>
                    <li><a href="#">CSS</a></li>
                    <li><a href="#">JavaScript</a></li>
                    <li><a href="#">JSP</a></li>
                    <li><a href="#">SPRING</a></li>
                </ul>

            </div>
        </div>


        <div id="content">
            <div class="section">
                <div class="article">
                    <h2>MainArticle</h2>
                    <p>content list 1</p>
                </div>

                <div class="article">
                    <h2>MainArticle</h2>
                    <p>content list 2</p>
                </div>

                <div class="article">
                    <h2>MainArticle</h2>
                    <p>content list 3</p>
                </div>
            </div>

            <div class="aside">
                <div class="article">
                    <h2>MainArticle</h2>
                    <p>side menu</p>
                </div>
            </div>
        </div>
        <div id="footer">
            <h3>HTML + CSS</h3>
            <p>웹페이지의 기본적인 레이아웃 구조</p>
        </div>

    </div>

</body>

</html>
