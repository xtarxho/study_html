<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>왼쪽, 오른쪽 정렬</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        #container {
            margin: 10px auto;
            width: 500px;
            padding: 10px;
            background: #fdd;
            border: 5px solid black;
            overflow:hidden; /*float의 해제*/
        }

        h1 {
            text-align: center;
        }

        .menu1 {
            width: 200px;
            height: 80px;
            padding: 15px;
            background: #dda;
            float:left;
        }

        .menu2 {
            width: 200px;
            height: 80px;
            padding: 15px;
            background: #ba7;
            float:right;
        }
    </style>

</head>

<body>
    <div id="container">
        <h1>메뉴판</h1>

        <div class="menu1">짜장면</div>
        <div class="menu2">짬뽕</div>
    </div>
</body>

</html>
