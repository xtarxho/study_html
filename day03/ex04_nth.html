<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>nth_child 가상클래스</title>

    <style>
        li:nth-child(odd) {color: red;}/*홀수번째*/
        li:nth-child(even) {color: green;}/*짝수번째*/
        li:nth-child(4n) {background: yellow;}/*4의 배수한테 색을 줌*/
        li:nth-child(6) {color: black;}/*6번째 칸에 색을 줌*/
    </style>

</head>

<body>
    <ul>
        <li>1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
        <li>5</li>
        <li>6</li>
        <li>7</li>
        <li>8</li>
        <li>9</li>
        <li>10</li>
    </ul>

    <ul>
        <li>1</li>

        <li>6</li>

        <li>8</li>
        <li>9</li>
        <li>10</li>
    </ul>
</body>

</html>
