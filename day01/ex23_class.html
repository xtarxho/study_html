<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>클래스로 css정의하기</title>
    <style>
        h2 span{ color:rgb(92, 95, 97) }
        div.box h2{color:#f00}
        h2 span.span_b{ color:#00f }
        h2 span.span_g{color:rgb(33, 116, 12)}

    </style>
</head>

<body>
    <div class="box">
        <h2>
            <span>클래스</span>연습
        </h2>

        <div class="box">
            <h2>
                <span class="span_b">클래스</span>연습2
            </h2>
        </div>
    </div>

    <h2>
        클래스 <span class="span_g">연습3</span>
    </h2>

</body>

</html>
