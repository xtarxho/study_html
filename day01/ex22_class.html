<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>클래스 접근</title>

    <style>
        /*text라는 이름의 클래스로 접근하세요*/
        .text{ color:#9dc }
        p.text{ color:#3f1; }
        /* h2.text{ color:#0f0 } */
        p{ color:#00f; }
        body p.myp span.sp{ color:#aaf }
    </style>

</head>

<body>
    <!-- 클래스 : 디자인을 목적으로 태그를 구별하기 위한 식별자
         중복된 이름으로 만들어도 상관X -->
    <h2 class="text">클래스 연습중</h2>

    <p class="myp">클래스 <span class="sp">연습중</span></p>

    <p class="text">클래스 연습중</p>

</body>

</html>
