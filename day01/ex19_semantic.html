<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>semantic(시멘틱)</title>
</head>

<body>
    <!-- 시멘틱 태그 : 태그의 이름만으로 어떤 컨텐츠를 
     관리하고 있는지를 알 수 있도록 하는 '의미가 있는 html태그' -->
     <table border="1">
        <thead>
            <th>구분</th>
            <th>태블릿PC</th>
            <th>스마트폰</th>
        </thead>

        <tfoot>
            <tr>
                <th>총 판매량</th>
                <td>5만대</td>
                <td>16만대</td>
            </tr>
        </tfoot>

        <tbody>
            <tr>
                <th>상반기 판매량</th>
                <td>2만대</td>
                <td>5만대</td>
            </tr>

            <tr>
                <th>하반기 판매량</th>
                <td>3만대</td>
                <td>11만대</td>
            </tr>
        </tbody>

        
     </table>
</body>

</html>
